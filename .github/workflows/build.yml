name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernel-version: ["5.4", "5.10", "5.15", "6.1", "6.6", "7.0"]
    
    container:
      image: ubuntu:20.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            linux-headers-generic \
            linux-image-generic \
            git \
            make \
            gcc \
            kmod
      
      - name: Display kernel info
        run: |
          sudo uname -r
          sudo ls -la /lib/modules/
      
      - name: Build driver
        run: |
          sudo make clean
          sudo make
      
      - name: Check compilation result
        run: |
          if [ -f *.ko ]; then
            echo "✓ Module compiled successfully"
            file *.ko
          else
            echo "✗ Build failed"
            exit 1
          fi
      
      - name: Run basic checks
        run: |
          echo "Checking for obvious issues..."
          sudo modinfo smifb.ko 2>/dev/null || echo "Module info check completed"
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-module-${{ matrix.kernel-version }}
          path: "*.ko"
          retention-days: 30

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      
      - name: Static code analysis
        continue-on-error: true
        run: |
          sudo cppcheck --enable=all --suppress=missingIncludeSystem . 2>&1 | head -100
