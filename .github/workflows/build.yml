name: Build and Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kernel ${{ matrix.kernel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: "5.4"
            image: ubuntu:20.04
            headers: linux-headers-generic
          - kernel: "5.10"
            image: debian:bullseye
            headers: linux-headers-amd64
          - kernel: "5.15"
            image: ubuntu:22.04
            headers: linux-headers-generic
          - kernel: "6.1"
            image: debian:bookworm
            headers: linux-headers-amd64
          - kernel: "6.6"
            image: vicamo/mainline-kernel-headers:6.6
            headers: ""
          - kernel: "7.0"
            image: vicamo/mainline-kernel-headers:7.0
            headers: ""

    # GitHub runs every step in this job inside the selected Docker image.
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Configure archived Debian 11 repository
        if: matrix.kernel == '5.10'
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] http://archive.debian.org/debian bullseye main' \
            > /etc/apt/sources.list
          if [ -d /etc/apt/sources.list.d ]; then
            find /etc/apt/sources.list.d -type f -delete
          fi
      - name: Install build tools and headers
        env:
          DEBIAN_FRONTEND: noninteractive
          HEADER_PACKAGE: ${{ matrix.headers }}
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            file \
            git \
            kmod \
            ${HEADER_PACKAGE}
          rm -rf /var/lib/apt/lists/*

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Select kernel headers
        env:
          EXPECTED_KERNEL: ${{ matrix.kernel }}
        run: |
          KVER="$({
            for directory in /lib/modules/*; do
              [ -d "${directory}/build" ] && basename "${directory}"
            done
          } | sort -V | tail -n 1)"

          if [ -z "${KVER}" ]; then
            echo "No prepared kernel headers found under /lib/modules" >&2
            exit 1
          fi

          case "${KVER}" in
            "${EXPECTED_KERNEL}".*|"${EXPECTED_KERNEL}"-*) ;;
            *)
              echo "Expected kernel ${EXPECTED_KERNEL}.x, found ${KVER}" >&2
              exit 1
              ;;
          esac

          echo "KVER=${KVER}" >> "${GITHUB_ENV}"
          echo "Building against /lib/modules/${KVER}/build"

      - name: Build driver
        run: |
          make KVER="${KVER}" clean
          make KVER="${KVER}" -j"$(nproc)"

      - name: Verify module
        run: |
          test -s smifb.ko
          file smifb.ko
          modinfo smifb.ko
          modinfo -F vermagic smifb.ko | grep -F "${KVER}"

      - name: Upload module
        uses: actions/upload-artifact@v7
        with:
          name: smifb-kernel-${{ matrix.kernel }}
          path: smifb.ko
          if-no-files-found: error
          retention-days: 30

  code-quality:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        continue-on-error: true
        run: cppcheck --enable=all --suppress=missingIncludeSystem .
